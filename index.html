<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест микрофона</title>
<style>
  body { margin: 0; padding: 16px; font: 16px/1.4 -apple-system, system-ui, sans-serif; background: #f4eee6; color: #221d28; }
  h3 { margin: 0 0 .5rem; }
  button { display: block; width: 100%; margin: 8px 0; padding: 14px; font-size: 17px; border: 0; border-radius: 10px; background: #7a3d92; color: #fff; }
  button:disabled { opacity: .35; }
  button.live { background: #c0392b; opacity: 1; }
  .small { font-size: 13px; color: #6b6474; }
  #status { font-weight: 600; margin: 8px 0; }
  #meter { height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; margin: 4px 0 12px; }
  #meter div { height: 100%; width: 0; background: #3a8f3a; }
  #log { width: 100%; box-sizing: border-box; height: 220px; font: 12px/1.35 ui-monospace, monospace; border: 0; border-radius: 8px; padding: 8px; }
</style>

<h3>🎧 Петь под музыку в наушниках</h3>
<p class="small" id="env"></p>
<p id="status">Наденьте наушники и нажимайте кнопки по порядку.</p>

<button id="b-music">1. ▶️ Музыка без микрофона</button>
<button id="b-mic">2. 🎤 Микрофон наушников</button>
<button id="b-phone">2б. 📱 Микрофон телефона</button>
<p class="small" id="mic">Микрофон выключен</p>
<div id="meter"><div></div></div>
<button id="b-rec" disabled>3. ⏺ Петь под музыку</button>
<button id="b-play" disabled>4. 🎧 Послушать голос</button>
<button id="b-mix" disabled>5. 🎧 Голос и музыка, как записались</button>
<button id="b-send" disabled>6. 📤 Отправить</button>
<button id="b-off" disabled>7. 🔇 Выключить микрофон</button>
<button id="b-copy">📋 Скопировать отчёт</button>
<textarea id="log" readonly></textarea>

<script>
const $ = id => document.getElementById(id);
const t0 = performance.now();
const log = (...parts) => {
  $('log').value += `${((performance.now() - t0) / 1000).toFixed(1)}s ${parts.join(' ')}\n`;
  $('log').scrollTop = 1e9;
};
const fail = e => log('ОШИБКА', e && e.name, e && e.message || e);
const status = text => { $('status').textContent = text; };
window.onerror = message => log('ОШИБКА', message);
window.onunhandledrejection = e => fail(e.reason);

// Telegram передаёт параметры запуска Mini App в хеше адреса,
// бот — адреса заготовки и загрузки в query.
const launch = new URLSearchParams(location.hash.slice(1));
const query = new URLSearchParams(location.search);
const guideUrl = query.get('guide');
const putUrl = query.get('put');
const where = launch.get('tgWebAppPlatform')
  ? `Mini App (${launch.get('tgWebAppPlatform')}, ${launch.get('tgWebAppVersion')})`
  : 'браузер';
$('env').textContent = `Открыто: ${where}`;
log('открыто:', where, '· заготовка:', guideUrl ? 'из хранилища' : 'встроенная', '· отправка:', putUrl ? 'есть' : 'нет');
log('ua:', navigator.userAgent);

const WARMUP = 3;   // секунд прогрева микрофона до записи: без него начало звучит «из ведра»
const LEAD = 1;     // секунд записи до начала музыки
const TAIL = 1.5;   // секунд записи после конца музыки

let ctx, music, stream, merger, dest, rec, recBlob, recBuf, voiceBuf, meterTimer;
let sources = [];

function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const own = ctx;
    own.onstatechange = () => log('звук:', own.state);
    log('звук: частота', ctx.sampleRate, 'outputLatency', ctx.outputLatency);
  }
  ctx.resume();
  return ctx;
}

function stopAll() {
  sources.forEach(s => { try { s.stop(); } catch { /* уже остановлен */ } });
  sources = [];
}

function play(buffer, { when = 0, toRecord = false } = {}) {
  const src = audio().createBufferSource();
  src.buffer = buffer;
  src.connect(ctx.destination);
  if (toRecord) src.connect(merger, 0, 1);
  src.start(ctx.currentTime + when);
  sources.push(src);
  return src;
}

// Встроенная мелодия: первая фраза в левом канале, вторая в правом.
// Бот кладёт в хранилище такую же, так что по ней можно мерить задержку.
function tune() {
  const c = audio(), rate = c.sampleRate, note = Math.round(rate / 2), steps = [0, 2, 4, 5, 7, 5, 4, 2];
  const buffer = c.createBuffer(2, note * 40, rate);
  for (let i = 0; i < 40; i++) {
    const f = 220 * 2 ** (steps[i % 8] / 12);
    const channel = buffer.getChannelData(Math.floor(i / 8) % 2);
    for (let n = 0; n < note; n++) {
      const s = n / rate, env = Math.min(1, s * 50) * Math.exp(-s * 3);
      channel[i * note + n] = 0.3 * env * (Math.sin(2 * Math.PI * f * s) + 0.5 * Math.sin(4 * Math.PI * f * s) + 0.25 * Math.sin(6 * Math.PI * f * s));
    }
  }
  return buffer;
}

async function getMusic() {
  if (music) return music;
  if (!guideUrl) return (music = tune());
  status('Загружаю музыку…');
  const response = await fetch(guideUrl);
  if (!response.ok) throw new Error(`заготовка не скачалась: ${response.status}`);
  music = await audio().decodeAudioData(await response.arrayBuffer());
  log('заготовка:', music.duration.toFixed(1), 'с,', music.numberOfChannels, 'кан.');
  return music;
}

$('b-music').onclick = async () => {
  audio();
  stopAll();
  try { play(await getMusic()); } catch (e) { fail(e); return; }
  status('Играет музыка. Запомните, как она звучит.');
  log('музыка', stream ? 'при включённом микрофоне' : 'без микрофона');
};

async function showMic() {
  if (!stream) return;
  const track = stream.getAudioTracks()[0];
  $('mic').textContent = `Пишет: ${track.label || '?'}`;
  log('пишет:', track.label, JSON.stringify(track.getSettings()));
  const devices = await navigator.mediaDevices.enumerateDevices();
  log('устройства:', devices.map(d => `${d.kind}:${d.label || '?'}`).join(' | '));
}

if (navigator.mediaDevices) {
  navigator.mediaDevices.addEventListener('devicechange', () => { log('devicechange'); showMic(); });
}

// Шумоподавление и автогромкость портят пение и, по отчётам WebKit,
// уводят звук из наушников в динамик.
const RAW = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };

// Микрофон наушников переводит Bluetooth в режим звонка и портит звук в ушах.
// Проверяем, остаётся ли качество, если писать встроенным микрофоном телефона.
async function phoneMic() {
  const probe = await navigator.mediaDevices.getUserMedia({ audio: RAW });
  const devices = await navigator.mediaDevices.enumerateDevices();
  probe.getTracks().forEach(t => t.stop());
  const phone = devices.find(d => d.kind === 'audioinput' && /iphone|встро|built-in|телефон|phone/i.test(d.label));
  log('микрофон телефона:', phone ? phone.label : 'не найден');
  if (!phone) throw new Error('встроенный микрофон не найден');
  return navigator.mediaDevices.getUserMedia({ audio: { ...RAW, deviceId: { exact: phone.deviceId } } });
}

$('b-mic').onclick = () => openMic(false);
$('b-phone').onclick = () => openMic(true);

async function openMic(usePhone) {
  audio();
  try {
    stream = usePhone ? await phoneMic() : await navigator.mediaDevices.getUserMedia({ audio: RAW });
  } catch (e) {
    log('микрофон НЕ дали:');
    fail(e);
    return;
  }
  const track = stream.getAudioTracks()[0];
  track.onmute = () => log('микрофон: mute');
  track.onunmute = () => log('микрофон: unmute');
  track.onended = () => log('микрофон: ended');
  log('микрофон дали');

  // Запись в два канала: левый — голос, правый — музыка ровно так, как она
  // ушла в наушники. По правому каналу видно, где в записи началась музыка.
  const mic = ctx.createMediaStreamSource(stream);
  merger = ctx.createChannelMerger(2);
  dest = ctx.createMediaStreamDestination();
  mic.connect(merger, 0, 0);
  merger.connect(dest);

  const analyser = ctx.createAnalyser(), data = new Float32Array(analyser.fftSize);
  mic.connect(analyser);
  meterTimer = setInterval(() => {
    analyser.getFloatTimeDomainData(data);
    const rms = Math.sqrt(data.reduce((sum, x) => sum + x * x, 0) / data.length);
    $('meter').firstChild.style.width = `${Math.min(100, rms * 400)}%`;
  }, 100);

  await showMic();
  log('outputLatency с микрофоном:', ctx.outputLatency);
  $('b-off').disabled = false;
  $('b-rec').textContent = '⏳ Микрофон прогревается…';
  status('Микрофон включён, прогревается.');
  setTimeout(() => {
    if (!stream) return;
    $('b-rec').textContent = '3. ⏺ Петь под музыку';
    $('b-rec').disabled = false;
    status('Можно петь.');
  }, WARMUP * 1000);
};

$('b-rec').onclick = async () => {
  audio();
  stopAll();
  let buffer;
  try { buffer = await getMusic(); } catch (e) { fail(e); return; }
  const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']
    .find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  rec = new MediaRecorder(dest.stream, type ? { mimeType: type } : undefined);
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    clearInterval(countdown);
    recBlob = new Blob(chunks, { type: rec.mimeType });
    log('записано:', Math.round(recBlob.size / 1024), 'КБ', rec.mimeType);
    try {
      recBuf = await audio().decodeAudioData(await recBlob.arrayBuffer());
      voiceBuf = ctx.createBuffer(1, recBuf.length, recBuf.sampleRate);
      voiceBuf.copyToChannel(recBuf.getChannelData(0), 0);
      log('запись:', recBuf.duration.toFixed(1), 'с,', recBuf.numberOfChannels, 'кан.');
    } catch (e) { fail(e); }
    $('b-rec').classList.remove('live');
    $('b-rec').textContent = '3. ⏺ Спеть ещё раз';
    $('b-rec').disabled = false;
    $('b-play').disabled = $('b-mix').disabled = false;
    $('b-send').disabled = !putUrl;
    status(putUrl ? 'Готово. Послушайте и отправьте.' : 'Готово. Отправка в этой ссылке не настроена.');
  };

  rec.start();
  play(buffer, { when: LEAD, toRecord: true });
  const total = LEAD + buffer.duration + TAIL;
  const started = performance.now();
  setTimeout(() => rec.state === 'recording' && rec.stop(), total * 1000);
  $('b-rec').disabled = true;
  $('b-rec').classList.add('live');
  const tick = () => {
    const left = Math.max(0, Math.ceil(total - (performance.now() - started) / 1000));
    $('b-rec').textContent = `🔴 Идёт запись — ${left} с`;
  };
  tick();
  const countdown = setInterval(tick, 250);
  $('b-play').disabled = $('b-mix').disabled = $('b-send').disabled = true;
  status('Пойте вместе с музыкой.');
  log('запись пошла:', buffer.duration.toFixed(1), 'с музыки, outputLatency', ctx.outputLatency);
};

$('b-play').onclick = () => { stopAll(); play(voiceBuf); log('слушаю голос'); };

$('b-mix').onclick = () => { stopAll(); play(recBuf); log('слушаю голос с музыкой'); };

$('b-send').onclick = async () => {
  $('b-send').disabled = true;
  status('Отправляю…');
  try {
    const response = await fetch(putUrl, { method: 'PUT', body: recBlob });
    if (!response.ok) throw new Error(`хранилище ответило ${response.status}`);
    log('отправлено:', Math.round(recBlob.size / 1024), 'КБ');
    status('✅ Отправлено.');
  } catch (e) {
    fail(e);
    status('Не отправилось — пришлите отчёт.');
    $('b-send').disabled = false;
  }
};

$('b-off').onclick = () => {
  stopAll();
  stream.getTracks().forEach(t => t.stop());
  stream = null;
  clearInterval(meterTimer);
  $('meter').firstChild.style.width = 0;
  // Новый AudioContext — чтобы iOS могла вернуть наушники из режима звонка.
  ctx.close();
  ctx = null;
  $('mic').textContent = 'Микрофон выключен';
  $('b-rec').disabled = $('b-off').disabled = true;
  $('b-rec').textContent = '3. ⏺ Петь под музыку';
  status('Микрофон выключен.');
  log('микрофон выключен');
};

$('b-copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('log').value);
    log('отчёт скопирован');
  } catch {
    $('log').select();
    log('скопировать не дали — текст выделен, скопируйте вручную или пришлите скриншот');
  }
};
</script>
